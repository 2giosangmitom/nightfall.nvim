name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - uses: extractions/setup-just@v4

      - name: Install dependencies
        run: just deps

      - name: Run tests
        run: just test

  generated:
    name: Generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - uses: extractions/setup-just@v4

      - name: Install dependencies
        run: just deps

      - name: Regenerate the documentation and the extras
        run: just generate

      - name: Fail if anything generated is out of date
        run: git diff --exit-code
