# nightfall.nvim - the maron flavor
# Generated by `just extras`, do not edit.

[mgr]
cwd = { fg = "#8be9fd" }
hovered = { fg = "#F5F5DC", bg = "#1c1c31" }
preview_hovered = { underline = true }
find_keyword = { fg = "#fcc737", bold = true }
find_position = { fg = "#e2adf2", bg = "reset", bold = true }
marker_copied = { fg = "#8EB486", bg = "#8EB486" }
marker_cut = { fg = "#ff6969", bg = "#ff6969" }
marker_marked = { fg = "#a6cdc6", bg = "#a6cdc6" }
marker_selected = { fg = "#fcc737", bg = "#fcc737" }
tab_active = { fg = "#00120b", bg = "#d18ce0" }
tab_inactive = { fg = "#F5F5DC", bg = "#1c1c31" }
tab_width = 1
count_copied = { fg = "#00120b", bg = "#8EB486" }
count_cut = { fg = "#00120b", bg = "#ff6969" }
count_selected = { fg = "#00120b", bg = "#fcc737" }
border_symbol = "│"
border_style = { fg = "#454955" }

[mode]
normal_main = { fg = "#00120b", bg = "#d18ce0", bold = true }
normal_alt = { fg = "#d18ce0", bg = "#1c1c31" }
select_main = { fg = "#00120b", bg = "#8EB486", bold = true }
select_alt = { fg = "#8EB486", bg = "#1c1c31" }
unset_main = { fg = "#00120b", bg = "#b796ac", bold = true }
unset_alt = { fg = "#b796ac", bg = "#1c1c31" }

[status]
overall = { fg = "#F5F5DC", bg = "#121518" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
progress_label = { fg = "#fafaff", bold = true }
progress_normal = { fg = "#d18ce0", bg = "#1c1c31" }
progress_error = { fg = "#ff6969", bg = "#1c1c31" }

[pick]
border = { fg = "#d18ce0" }
active = { fg = "#e2adf2", bold = true }
inactive = { fg = "#F5F5DC" }

[input]
border = { fg = "#d18ce0" }
title = { fg = "#F5F5DC" }
value = { fg = "#F5F5DC" }
selected = { bg = "#1c1c31" }

[confirm]
border = { fg = "#d18ce0" }
title = { fg = "#d18ce0" }
content = { fg = "#F5F5DC" }
list = { fg = "#8be9fd" }
btn_yes = { fg = "#00120b", bg = "#8EB486" }
btn_no = { fg = "#00120b", bg = "#ff6969" }
btn_labels = [ "  Yes  ", "  (N)o  " ]

[cmp]
border = { fg = "#d18ce0" }
active = { fg = "#e2adf2", bold = true }
inactive = { fg = "#F5F5DC" }

[tasks]
border = { fg = "#d18ce0" }
title = { fg = "#F5F5DC" }
hovered = { fg = "#e2adf2", underline = true }

[which]
cols = 3
mask = { bg = "#1c1c31" }
cand = { fg = "#8be9fd" }
rest = { fg = "#6b818c" }
desc = { fg = "#e2adf2" }
separator = "  "
separator_style = { fg = "#454955" }

[help]
on = { fg = "#8be9fd" }
run = { fg = "#e2adf2" }
hovered = { bg = "#1c1c31", bold = true }
footer = { fg = "#F5F5DC", bg = "#121518" }

[notify]
title_info = { fg = "#8EB486" }
title_warn = { fg = "#FFD95A" }
title_error = { fg = "#ff6969" }

[filetype]
rules = [
  { mime = "image/*", fg = "#8be9fd" },
  { mime = "{audio,video}/*", fg = "#fcc737" },
  { mime = "application/{,g}zip", fg = "#e2adf2" },
  { mime = "application/{tar,bzip*,7z-compressed,xz,rar}", fg = "#e2adf2" },
  { mime = "application/{pdf,doc,rtf}", fg = "#8EB486" },
  { name = "*", is = "orphan", bg = "#ff6969" },
  { name = "*", is = "exec", fg = "#8EB486" },
  { name = "*/", fg = "#d18ce0" },
]

