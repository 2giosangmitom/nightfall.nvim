# nightfall.nvim - the nightfall flavor
# Generated by `just extras`, do not edit.

[mgr]
cwd = { fg = "#8be9fd" }
hovered = { fg = "#e9e9f4", bg = "#181825" }
preview_hovered = { underline = true }
find_keyword = { fg = "#fcc737", bold = true }
find_position = { fg = "#e2adf2", bg = "reset", bold = true }
marker_copied = { fg = "#20e3b2", bg = "#20e3b2" }
marker_cut = { fg = "#ff5555", bg = "#ff5555" }
marker_marked = { fg = "#72bda3", bg = "#72bda3" }
marker_selected = { fg = "#fcc737", bg = "#fcc737" }
tab_active = { fg = "#011502", bg = "#9a86fd" }
tab_inactive = { fg = "#e9e9f4", bg = "#181825" }
tab_width = 1
count_copied = { fg = "#011502", bg = "#20e3b2" }
count_cut = { fg = "#011502", bg = "#ff5555" }
count_selected = { fg = "#011502", bg = "#fcc737" }
border_symbol = "│"
border_style = { fg = "#454955" }

[mode]
normal_main = { fg = "#011502", bg = "#9a86fd", bold = true }
normal_alt = { fg = "#9a86fd", bg = "#181825" }
select_main = { fg = "#011502", bg = "#20e3b2", bold = true }
select_alt = { fg = "#20e3b2", bg = "#181825" }
unset_main = { fg = "#011502", bg = "#dd9ac2", bold = true }
unset_alt = { fg = "#dd9ac2", bg = "#181825" }

[status]
overall = { fg = "#e9e9f4", bg = "#141523" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
progress_label = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#9a86fd", bg = "#181825" }
progress_error = { fg = "#ff5555", bg = "#181825" }

[pick]
border = { fg = "#9a86fd" }
active = { fg = "#e2adf2", bold = true }
inactive = { fg = "#e9e9f4" }

[input]
border = { fg = "#9a86fd" }
title = { fg = "#e9e9f4" }
value = { fg = "#e9e9f4" }
selected = { bg = "#181825" }

[confirm]
border = { fg = "#9a86fd" }
title = { fg = "#9a86fd" }
content = { fg = "#e9e9f4" }
list = { fg = "#8be9fd" }
btn_yes = { fg = "#011502", bg = "#20e3b2" }
btn_no = { fg = "#011502", bg = "#ff5555" }
btn_labels = [ "  Yes  ", "  (N)o  " ]

[cmp]
border = { fg = "#9a86fd" }
active = { fg = "#e2adf2", bold = true }
inactive = { fg = "#e9e9f4" }

[tasks]
border = { fg = "#9a86fd" }
title = { fg = "#e9e9f4" }
hovered = { fg = "#e2adf2", underline = true }

[which]
cols = 3
mask = { bg = "#181825" }
cand = { fg = "#8be9fd" }
rest = { fg = "#888da7" }
desc = { fg = "#e2adf2" }
separator = "  "
separator_style = { fg = "#454955" }

[help]
on = { fg = "#8be9fd" }
run = { fg = "#e2adf2" }
hovered = { bg = "#181825", bold = true }
footer = { fg = "#e9e9f4", bg = "#141523" }

[notify]
title_info = { fg = "#20e3b2" }
title_warn = { fg = "#f2fa95" }
title_error = { fg = "#ff5555" }

[filetype]
rules = [
  { mime = "image/*", fg = "#8be9fd" },
  { mime = "{audio,video}/*", fg = "#fcc737" },
  { mime = "application/{,g}zip", fg = "#e2adf2" },
  { mime = "application/{tar,bzip*,7z-compressed,xz,rar}", fg = "#e2adf2" },
  { mime = "application/{pdf,doc,rtf}", fg = "#20e3b2" },
  { name = "*", is = "orphan", bg = "#ff5555" },
  { name = "*", is = "exec", fg = "#20e3b2" },
  { name = "*/", fg = "#9a86fd" },
]

