# nightfall.nvim - the deeper-night flavor
# Generated by `just extras`, do not edit.

[mgr]
cwd = { fg = "#b5ffe9" }
hovered = { fg = "#f8e9e9", bg = "#1c1c31" }
preview_hovered = { underline = true }
find_keyword = { fg = "#fcc737", bold = true }
find_position = { fg = "#e2adf2", bg = "reset", bold = true }
marker_copied = { fg = "#a6e3a1", bg = "#a6e3a1" }
marker_cut = { fg = "#ff5e5b", bg = "#ff5e5b" }
marker_marked = { fg = "#72bda3", bg = "#72bda3" }
marker_selected = { fg = "#fcc737", bg = "#fcc737" }
tab_active = { fg = "#1a181b", bg = "#cba6f7" }
tab_inactive = { fg = "#f8e9e9", bg = "#1c1c31" }
tab_width = 1
count_copied = { fg = "#1a181b", bg = "#a6e3a1" }
count_cut = { fg = "#1a181b", bg = "#ff5e5b" }
count_selected = { fg = "#1a181b", bg = "#fcc737" }
border_symbol = "│"
border_style = { fg = "#454955" }

[mode]
normal_main = { fg = "#1a181b", bg = "#cba6f7", bold = true }
normal_alt = { fg = "#cba6f7", bg = "#1c1c31" }
select_main = { fg = "#1a181b", bg = "#a6e3a1", bold = true }
select_alt = { fg = "#a6e3a1", bg = "#1c1c31" }
unset_main = { fg = "#1a181b", bg = "#ceabb1", bold = true }
unset_alt = { fg = "#ceabb1", bg = "#1c1c31" }

[status]
overall = { fg = "#f8e9e9", bg = "#0e131b" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
progress_label = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#cba6f7", bg = "#1c1c31" }
progress_error = { fg = "#ff5e5b", bg = "#1c1c31" }

[pick]
border = { fg = "#cba6f7" }
active = { fg = "#e2adf2", bold = true }
inactive = { fg = "#f8e9e9" }

[input]
border = { fg = "#cba6f7" }
title = { fg = "#f8e9e9" }
value = { fg = "#f8e9e9" }
selected = { bg = "#1c1c31" }

[confirm]
border = { fg = "#cba6f7" }
title = { fg = "#cba6f7" }
content = { fg = "#f8e9e9" }
list = { fg = "#b5ffe9" }
btn_yes = { fg = "#1a181b", bg = "#a6e3a1" }
btn_no = { fg = "#1a181b", bg = "#ff5e5b" }
btn_labels = [ "  Yes  ", "  (N)o  " ]

[cmp]
border = { fg = "#cba6f7" }
active = { fg = "#e2adf2", bold = true }
inactive = { fg = "#f8e9e9" }

[tasks]
border = { fg = "#cba6f7" }
title = { fg = "#f8e9e9" }
hovered = { fg = "#e2adf2", underline = true }

[which]
cols = 3
mask = { bg = "#1c1c31" }
cand = { fg = "#b5ffe9" }
rest = { fg = "#6060a4" }
desc = { fg = "#e2adf2" }
separator = "  "
separator_style = { fg = "#454955" }

[help]
on = { fg = "#b5ffe9" }
run = { fg = "#e2adf2" }
hovered = { bg = "#1c1c31", bold = true }
footer = { fg = "#f8e9e9", bg = "#0e131b" }

[notify]
title_info = { fg = "#a6e3a1" }
title_warn = { fg = "#f9e2af" }
title_error = { fg = "#ff5e5b" }

[filetype]
rules = [
  { mime = "image/*", fg = "#b5ffe9" },
  { mime = "{audio,video}/*", fg = "#fcc737" },
  { mime = "application/{,g}zip", fg = "#e2adf2" },
  { mime = "application/{tar,bzip*,7z-compressed,xz,rar}", fg = "#e2adf2" },
  { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },
  { name = "*", is = "orphan", bg = "#ff5e5b" },
  { name = "*", is = "exec", fg = "#a6e3a1" },
  { name = "*/", fg = "#cba6f7" },
]

